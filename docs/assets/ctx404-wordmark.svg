<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">CTX404 pulse wordmark</title>
  <desc id="desc">Large CTX lettering crossed by a heartbeat data signal that recovers into 404.</desc>

  <defs>
    <linearGradient id="signal" x1="80" y1="0" x2="1315" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#edf7f0"/>
      <stop offset=".58" stop-color="#edf7f0"/>
      <stop offset=".72" stop-color="#41e681"/>
      <stop offset="1" stop-color="#41e681"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="560" rx="28" fill="#050a08"/>

  <!-- Subtle circuit scaffolding: enough to say infrastructure, not decoration. -->
  <g fill="none" stroke="#173428" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M112 164H194L232 126H344"/>
    <path d="M428 108V72H598L630 104"/>
    <path d="M736 92H854L896 134H970"/>
    <path d="M166 394H246L282 430H404"/>
    <path d="M550 448V486H730L764 452"/>
    <path d="M842 438H930L968 400H1042"/>
  </g>
  <g fill="#41e681">
    <rect x="101" y="153" width="22" height="22"/>
    <rect x="417" y="61" width="22" height="22"/>
    <rect x="959" y="123" width="22" height="22"/>
    <rect x="155" y="383" width="22" height="22"/>
    <rect x="539" y="475" width="22" height="22"/>
    <rect x="1031" y="389" width="22" height="22"/>
  </g>

  <!-- CTX is the dominant machine-like monogram. -->
  <g aria-label="CTX" fill="none" stroke="#edf7f0" stroke-width="36" stroke-linejoin="bevel">
    <path d="M330 130H150L92 188V372L150 430H330"/>
    <path d="M382 130H650M516 130V430"/>
    <path d="M704 130L938 430M938 130L704 430"/>
  </g>

  <!-- Clearance makes the pulse physically cut across the large letters. -->
  <path d="M70 280H346L370 280L394 228L430 350L466 280H634L662 280L686 246L716 314L746 280H950L976 280L994 256L1014 304L1036 280H1326"
        fill="none" stroke="#050a08" stroke-width="34" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Heartbeat/data pulse: white context enters, green continuity exits. -->
  <path d="M70 280H346L370 280L394 228L430 350L466 280H634L662 280L686 246L716 314L746 280H950L976 280L994 256L1014 304L1036 280H1326"
        fill="none" stroke="url(#signal)" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter" filter="url(#softGlow)"/>

  <!-- A single orange fault marker separates loss from recovery. -->
  <rect x="945" y="271" width="22" height="18" fill="#ff6b35"/>

  <!-- 404 rides the restored signal. -->
  <text x="1028" y="260"
        fill="#41e681"
        font-family="Bahnschrift, Rajdhani, 'Arial Narrow', sans-serif"
        font-size="120"
        font-weight="700"
        letter-spacing="12">404</text>

  <text x="1040" y="347"
        fill="#789083"
        font-family="Consolas, 'Courier New', monospace"
        font-size="23"
        font-weight="600"
        letter-spacing="7">CONTEXT SIGNAL</text>
</svg>
