name: Bug report
description: Report reproducible CTX404 behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include credentials, secret values or private project context.
  - type: input
    id: version
    attributes:
      label: CTX404 version
      placeholder: v0.9.1 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, shell, Claude Code, Python and Git versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use a disposable project and sanitize all output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, secret values and private project context.
          required: true
